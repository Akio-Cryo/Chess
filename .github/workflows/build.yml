              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E9E9F2"
                  android:pathData="M32,38 L54,56 L76,38 L76,49 L54,67 L32,49 Z"/>
              <path android:fillColor="#7C5CFF"
