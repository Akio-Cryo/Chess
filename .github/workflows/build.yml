      - name: manifest
        run: |
          set -euo pipefail
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Gambitlens"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_X

      - name: activity
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/dev/gambitlens/app
          cat > app/src/main/java/dev/gambitlens/app/MainActivity.kt <<'EOF_K'
          package dev.gambitlens.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.TextView
          import kotlin.math.abs
          import kotlin.math.roundToInt

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private lateinit var bubble: TextView
              private var payload = ""

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  payload = assets.open("overlay.js").bufferedReader().use { it.readText() }

                  val root = FrameLayout(this)
                  web = WebView(this)
                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      mediaPlaybackRequiresUserGesture = false
                      userAgentString =
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 " +
                          "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
                  }
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true)
                  web.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          attach()
                      }
                  }
                  root.addView(web, FrameLayout.LayoutParams(-1, -1))

                  bubble = makeBubble()
                  val lp = FrameLayout.LayoutParams(dp(46), dp(46))
                  lp.gravity = Gravity.TOP or Gravity.LEFT
                  lp.leftMargin = resources.displayMetrics.widthPixels - dp(58)
                  lp.topMargin = dp(120)
                  root.addView(bubble, lp)

                  setContentView(root)
                  web.loadUrl("https://www.chess.com/play/online")
              }

              private fun attach() {
                  web.evaluateJavascript(payload, null)
                  web.postDelayed({ web.evaluateJavascript(payload, null) }, 1200)
                  web.postDelayed({ web.evaluateJavascript(payload, null) }, 3500)
              }

              private fun makeBubble(): TextView {
                  val tv = TextView(this)
                  tv.text = "GL"
                  tv.setTextColor(Color.WHITE)
                  tv.textSize = 15f
                  tv.gravity = Gravity.CENTER
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(Color.parseColor("#7C5CFF"))
                  tv.background = bg
                  tv.elevation = dp(8).toFloat()

                  var downX = 0f
                  var downY = 0f
                  var moved = false

                  tv.setOnTouchListener { v, e ->
                      val params = v.layoutParams as FrameLayout.LayoutParams
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX
                              downY = e.rawY
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - downX).roundToInt()
                              val dy = (e.rawY - downY).roundToInt()
                              if (abs(dx) > 8 || abs(dy) > 8) moved = true
                              params.leftMargin = (params.leftMargin + dx).coerceAtLeast(0)
                              params.topMargin = (params.topMargin + dy).coerceAtLeast(0)
                              downX = e.rawX
                              downY = e.rawY
                              v.layoutParams = params
                          }
                          MotionEvent.ACTION_UP -> if (!moved) {
                              web.evaluateJavascript("window.__GL__&&window.__GL__.toggle()", null)
                          }
                      }
                      true
                  }
                  return tv
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF_K

      - name: overlay
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/overlay.js <<'EOF_J'
          (function () {
            if (window.__GL__) return;

            var KN = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
            var DIAG = [[1,1],[1,-1],[-1,1],[-1,-1]];
            var ORTH = [[1,0],[-1,0],[0,1],[0,-1]];
            var KINGD = DIAG.concat(ORTH);
            var START = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR";
            var F2I = { a:0,b:1,c:2,d:3,e:4,f:5,g:6,h:7 };

            function file(s) { return s & 7; }
            function rank(s) { return s >> 3; }
            function idx(n) { return F2I[n[0]] + (n.charCodeAt(1) - 49) * 8; }
            function name(s) { return "abcdefgh"[file(s)] + (rank(s) + 1); }
            function color(p) { return p ? (p === p.toUpperCase() ? "w" : "b") : null; }
            function opp(c) { return c === "w" ? "b" : "w"; }

            function parseFen(f) {
              var parts = f.split(" ");
              var b = new Array(64).fill(null);
              var s = 56;
              for (var i = 0; i < parts[0].length; i++) {
                var ch = parts[0][i];
                if (ch === "/") { s -= 16; continue; }
                if (ch >= "1" && ch <= "8") { s += +ch; continue; }
                b[s++] = ch;
              }
              return {
                b: b,
                side: parts[1],
                castling: parts[2] === "-" ? "" : parts[2],
                ep: parts[3] === "-" ? null : idx(parts[3])
              };
            }

            function kingSq(b, c) {
              for (var i = 0; i < 64; i++) {
                var p = b[i];
                if (p && p.toLowerCase() === "k" && color(p) === c) return i;
              }
              return -1;
            }

            function attacked(st, sq, by) {
              var b = st.b, f = file(sq), r = rank(sq), i, df, dr, nf, nr, p, to;
              var back = by === "w" ? 1 : -1;
              for (i = 0; i < 2; i++) {
                df = i ? 1 : -1; nf = f + df; nr = r - back;
                if (nf < 0 || nf > 7 || nr < 0 || nr > 7) continue;
                p = b[nr * 8 + nf];
                if (p && color(p) === by && p.toLowerCase() === "p") return true;
              }
              for (i = 0; i < 8; i++) {
                df = KN[i][0]; dr = KN[i][1]; nf = f + df; nr = r + dr;
                if (nf < 0 || nf > 7 || nr < 0 || nr > 7) continue;
                p = b[nr * 8 + nf];
                if (p && color(p) === by && p.toLowerCase() === "n") return true;
              }
              for (i = 0; i < 8; i++) {
                df = KINGD[i][0]; dr = KINGD[i][1]; nf = f + df; nr = r + dr;
                if (nf < 0 || nf > 7 || nr < 0 || nr > 7) continue;
                p = b[nr * 8 + nf];
                if (p && color(p) === by && p.toLowerCase() === "k") return true;
              }
              for (i = 0; i < 4; i++) {
                df = DIAG[i][0]; dr = DIAG[i][1]; nf = f + df; nr = r + dr;
                while (nf >= 0 && nf < 8 && nr >= 0 && nr < 8) {
                  to = nr * 8 + nf; p = b[to];
                  if (p) { if (color(p) === by && "bq".indexOf(p.toLowerCase()) >= 0) return true; break; }
                  nf += df; nr += dr;
                }
              }
              for (i = 0; i < 4; i++) {
                df = ORTH[i][0]; dr = ORTH[i][1]; nf = f + df; nr = r + dr;
                while (nf >= 0 && nf < 8 && nr >= 0 && nr < 8) {
                  to = nr * 8 + nf; p = b[to];
                  if (p) { if (color(p) === by && "rq".indexOf(p.toLowerCase()) >= 0) return true; break; }
                  nf += df; nr += dr;
                }
              }
              return false;
            }

            function gen(st) {
              var b = st.b, side = st.side, out = [];
              function push(from, to, promo) { out.push({ from: from, to: to, promo: promo || null }); }
              for (var s = 0; s < 64; s++) {
                var p = b[s];
                if (!p || color(p) !== side) continue;
                var t = p.toLowerCase(), f = file(s), r = rank(s), i, df, dr, nf, nr, one, two, to;
                if (t === "p") {
                  var dir = side === "w" ? 1 : -1;
                  one = s + dir * 8;
                  if (one >= 0 && one < 64 && !b[one]) {
                    if (rank(one) === 7 || rank(one) === 0) {
                      push(s, one, "q"); push(s, one, "r"); push(s, one, "b"); push(s, one, "n");
                    } else push(s, one);
                    two = s + dir * 16;
                    if ((side === "w" ? r === 1 : r === 6) && !b[two]) push(s, two);
                  }
                  for (i = 0; i < 2; i++) {
                    df = i ? 1 : -1; nf = f + df; nr = r + dir;
                    if (nf < 0 || nf > 7 || nr < 0 || nr > 7) continue;
                    to = nr * 8 + nf;
                    if (b[to] && color(b[to]) !== side) {
                      if (nr === 7 || nr === 0) {
                        push(s, to, "q"); push(s, to, "r"); push(s, to, "b"); push(s, to, "n");
                      } else push(s, to);
                    } else if (!b[to] && to === st.ep) push(s, to);
                  }
                } else if (t === "n" || t === "k") {
                  var dirs = t === "n" ? KN : KINGD;
                  for (i = 0; i < 8; i++) {
                    nf = f + dirs[i][0]; nr = r + dirs[i][1];
                    if (nf < 0 || nf > 7 || nr < 0 || nr > 7) continue;
                    to = nr * 8 + nf;
                    if (!b[to] || color(b[to]) !== side) push(s, to);
                  }
                } else {
                  var rays = t === "b" ? DIAG : t === "r" ? ORTH : KINGD;
                  for (i = 0; i < 8; i++) {
                    nf = f + rays[i][0]; nr = r + rays[i][1];
                    while (nf >= 0 && nf < 8 && nr >= 0 && nr < 8) {
                      to = nr * 8 + nf;
                      if (!b[to]) push(s, to);
                      else { if (color(b[to]) !== side) push(s, to); break; }
                      nf += rays[i][0]; nr += rays[i][1];
                    }
                  }
                }
              }
              var home = side === "w" ? 4 : 60;
              var their = opp(side);
              if (st.castling.indexOf(side === "w" ? "K" : "k") >= 0 &&
                  !b[home + 1] && !b[home + 2] && b[home + 3] &&
                  !attacked(st, home, their) && !attacked(st, home + 1, their)) push(home, home + 2);
              if (st.castling.indexOf(side === "w" ? "Q" : "q") >= 0 &&
                  !b[home - 1] && !b[home - 2] && !b[home - 3] && b[home - 4] &&
                  !attacked(st, home, their) && !attacked(st, home - 1, their)) push(home, home - 2);
              return out;
            }

            function apply(st, m) {
              var b = st.b.slice(), p = b[m.from], cap = b[m.to];
              var castling = st.castling, ep = null;
              var map = { 0: "Q", 7: "K", 56: "q", 63: "k" };
              b[m.to] = m.promo ? (color(p) === "w" ? m.promo.toUpperCase() : m.promo) : p;
              b[m.from] = null;
              if (p.toLowerCase() === "k") {
                castling = castling.replace(st.side === "w" ? "KQ" : "kq", "");
                if (Math.abs(m.to - m.from) === 2) {
                  var home = st.side === "w" ? 4 : 60;
                  if (m.to > m.from) { b[home + 1] = b[home + 3]; b[home + 3] = null; }
                  else { b[home - 1] = b[home - 4]; b[home - 4] = null; }
                }
              }
              if (p.toLowerCase() === "r" && map[m.from]) castling = castling.replace(map[m.from], "");
              if (cap && map[m.to]) castling = castling.replace(map[m.to], "");
              if (p.toLowerCase() === "p" && Math.abs(m.to - m.from) === 16) ep = (m.from + m.to) / 2;
              return { b: b, side: opp(st.side), castling: castling, ep: ep };
            }

            function legal(st) {
              var out = [], moves = gen(st);
              for (var i = 0; i < moves.length; i++) {
                var ns = apply(st, moves[i]);
                if (!attacked(ns, kingSq(ns.b, st.side), opp(st.side))) out.push(moves[i]);
              }
              return out;
            }

            function playSan(st, raw) {
              var san = raw.trim().replace(/0/g, "O").replace(/[!?]+$/, "").replace(/[+#]$/, "");
              var moves = legal(st), i, m = null;
              if (/^O-O(-O)?$/.test(san)) {
                var home = st.side === "w" ? 4 : 60;
                var dest = san === "O-O" ? home + 2 : home - 2;
                for (i = 0; i < moves.length; i++) {
                  if (moves[i].from === home && moves[i].to === dest) { m = moves[i]; break; }
                }
                return m ? apply(st, m) : null;
              }
              var mm = san.match(/^([KQRBN])?([a-h])?([1-8])?x?([a-h][1-8])(?:=([QRBN]))?$/);
              if (!mm) return null;
              var pc = mm[1], ff = mm[2], fr = mm[3], target = idx(mm[4]), promo = mm[5];
              for (i = 0; i < moves.length; i++) {
                var c = moves[i], p = st.b[c.from];
                if (!p) continue;
                if (p.toLowerCase() !== (pc ? pc.toLowerCase() : "p")) continue;
                if (c.to !== target) continue;
                if (ff && file(c.from) !== F2I[ff]) continue;
                if (fr && rank(c.from) !== +fr - 1) continue;
                if (promo ? (c.promo || "").toUpperCase() !== promo : !!c.promo) continue;
                m = c; break;
              }
              return m ? apply(st, m) : null;
            }

            function toFen(st) {
              var rows = [], r, f, p, row, empty;
              for (r = 7; r >= 0; r--) {
                row = ""; empty = 0;
                for (f = 0; f < 8; f++) {
                  p = st.b[r * 8 + f];
                  if (!p) { empty++; continue; }
                  if (empty) { row += empty; empty = 0; }
                  row += p;
                }
                if (empty) row += empty;
                rows.push(row);
              }
              return rows.join("/") + " " + st.side + " " +
                (st.castling || "-") + " " + (st.ep === null ? "-" : name(st.ep)) + " 0 1";
            }

            var SANRE = /^([KQRBN]?[a-h]?[1-8]?x?[a-h][1-8](=[QRBN])?|O-O(-O)?)$/;

            function readSans() {
              var sels = [
                ".vertical-move-list .node",
                ".move-list .node",
                "wc-move-list .node",
                ".play-controller-moves .node",
                ".moves .node"
              ];
              for (var i = 0; i < sels.length; i++) {
                var nodes = document.querySelectorAll(sels[i]);
                if (!nodes.length) continue;
                var out = [];
                for (var j = 0; j < nodes.length; j++) {
                  var span = nodes[j].querySelector(".node-highlight-content, .move, span");
                  var txt = (span ? span.textContent : nodes[j].textContent) || "";
                  txt = txt.trim().replace(/[!?]/g, "").replace(/[+#]$/, "");
                  if (SANRE.test(txt)) out.push(txt);
                }
                if (out.length) return out;
              }
              return [];
            }

            function boardEl() {
              return document.querySelector("wc-chess-board, chess-board, .board-layout-chessboard .board, .board");
            }

            function fenFromBoard() {
              var board = boardEl();
              if (!board) return null;
              var b = new Array(64).fill(null), found = 0;
              var pieces = board.querySelectorAll(".piece");
              for (var i = 0; i < pieces.length; i++) {
                var cls = pieces[i].className || "";
                var sm = cls.match(/\bsquare-(\d)(\d)\b/);
                var cm = cls.match(/\b([wb])([kqrbnp])\b/);
                if (!sm || !cm) continue;
                b[(+sm[2] - 1) * 8 + (+sm[1] - 1)] = cm[1] === "w" ? cm[2].toUpperCase() : cm[2];
                found++;
              }
              if (!found) return null;
              var sans = readSans();
              return toFen({
                b: b,
                side: sans.length % 2 === 0 ? "w" : "b",
                castling: "KQkq",
                ep: null
              });
            }

            function currentFen() {
              var sans = readSans();
              if (sans.length) {
                var st = parseFen(START);
                for (var i = 0; i < sans.length; i++) {
                  st = playSan(st, sans[i]);
                  if (!st) return fenFromBoard();
                }
                return toFen(st);
              }
              return fenFromBoard();
            }

            async function query(fen) {
              var r = await fetch("https://lichess.org/api/cloud-eval?multiPv=3&fen=" + encodeURIComponent(fen));
              if (!r.ok) return null;
              return r.json();
            }

            function clearArrows() {
              var old = document.getElementById("gl-arrows");
              if (old) old.remove();
            }

            function drawArrow(uci) {
              clearArrows();
              var board = boardEl();
              if (!board || !uci) return;
              if (getComputedStyle(board).position === "static") board.style.position = "relative";
              var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
              svg.id = "gl-arrows";
              svg.setAttribute("viewBox", "0 0 8 8");
              svg.setAttribute("preserveAspectRatio", "none");
              svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;overflow:visible";
              var flipped = board.classList.contains("flipped") || !!board.closest(".flipped");
              function cx(s) { return flipped ? 7 - file(s) + 0.5 : file(s) + 0.5; }
              function cy(s) { return flipped ? rank(s) + 0.5 : 7 - rank(s) + 0.5; }
              var a = idx(uci.slice(0, 2)), z = idx(uci.slice(2, 4));
              var x1 = cx(a), y1 = cy(a), x2 = cx(z), y2 = cy(z);
              var ang = Math.atan2(y2 - y1, x2 - x1);
              var head = 0.26;
              var bx = x2 - Math.cos(ang) * head, by = y2 - Math.sin(ang) * head;
              var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
              line.setAttribute("x1", x1); line.setAttribute("y1", y1);
              line.setAttribute("x2", bx); line.setAttribute("y2", by);
              line.setAttribute("stroke", "#7C5CFF");
              line.setAttribute("stroke-width", "0.13");
              line.setAttribute("stroke-linecap", "round");
              line.setAttribute("opacity", "0.9");
              var tip = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
              var w = 0.15;
              var p1 = [x2, y2];
              var p2 = [bx - Math.sin(ang) * w, by + Math.cos(ang) * w];
              var p3 = [bx + Math.sin(ang) * w, by - Math.cos(ang) * w];
              tip.setAttribute("points", p1.join(",") + " " + p2.join(",") + " " + p3.join(","));
              tip.setAttribute("fill", "#7C5CFF");
              tip.setAttribute("opacity", "0.9");
              svg.appendChild(line);
              svg.appendChild(tip);
              board.appendChild(svg);
            }

            function scoreOf(pv) {
              if (typeof pv.mate !== "undefined") return "M" + Math.abs(pv.mate);
              var cp = pv.cp || 0;
              return (cp > 0 ? "+" : "") + (cp / 100).toFixed(2);
